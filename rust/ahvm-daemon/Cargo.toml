[package]
name = "ahvm-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ahvm-engine = { path = "../ahvm-engine" }
ahvm-store = { path = "../ahvm-store" }
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.23.1"
futures-util = "0.3.34"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
libc = "0.2.189"
