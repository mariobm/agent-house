[workspace]
members = [
    "ahvm-proto",
    "ahvm-store",
    "ahvm-forge",
    "ahvm-engine",
    "ahvm-netd",
    "ahvm-daemon",
    "ahvm-cli",
    "ahvm-vmm",
]
resolver = "2"

[workspace.package]
version = "0.2.6"
edition = "2021"
license-file = "../LICENSE"

[workspace.lints.rust]
# `deny` (not `forbid`) so the two process-group helpers in ahvm-forge can
# carry a scoped `#[allow]` with their safety justification. Everything else
# must stay unsafe-free.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
