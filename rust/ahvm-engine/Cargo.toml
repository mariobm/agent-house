[package]
name = "ahvm-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = "0.10"
ahvm-proto = { path = "../ahvm-proto" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "net"] }
landlock = "0.4.7"

[dev-dependencies]
libc = "0.2"

[lints]
workspace = true
