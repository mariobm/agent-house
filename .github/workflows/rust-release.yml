name: Build release assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-client:
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
          - runner: macos-15-intel
            platform: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-libkrucible
        with:
          ssh-key: ${{ secrets.LIBKRUCIBLE_SSH_KEY }}
      - name: Build client with desktop viewer
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --locked -p ahvm-cli
          python3 scripts/test-rust-cli.py rust/target/release/ahvm
          python3 scripts/test-host-cli.py rust/target/release/ahvm
          bash desktop-viewer/build.sh
          mkdir -p "$RUNNER_TEMP/client/bin"
          cp -R desktop-viewer/dist "$RUNNER_TEMP/client/desktop"
          cp rust/target/release/ahvm "$RUNNER_TEMP/client/bin/"
          VERSION=$(rust/target/release/ahvm --version | cut -d' ' -f2)
          python3 scripts/package-distribution.py "$RUNNER_TEMP/client" dist "$VERSION" "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-${{ matrix.platform }}
          path: dist/*
  server:
    # The native VMM builder remains an explicitly provisioned Linux host.
    # Use the qualified glibc 2.35 build environment, not the deployment host.
    runs-on: [self-hosted, linux, x64, ahvm-build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/checkout-libkrucible
        with:
          ssh-key: ${{ secrets.LIBKRUCIBLE_SSH_KEY }}
      - name: Build runtime without bundling the guest image
        run: |
          set -euo pipefail
          make check
          make test
          AHVM_SKIP_GUEST=1 scripts/package-rust.sh "$RUNNER_TEMP/ahvm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          VERSION=$(rust/target/release/ahvm --version | cut -d' ' -f2)
          python3 scripts/package-distribution.py "$RUNNER_TEMP/ahvm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" dist "$VERSION" linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-linux-x86_64
          path: dist/*
      - name: Remove build directory
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ahvm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
