name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Rust Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Cargo resolves workspace path dependencies even when VMM is excluded.
      - uses: ./.github/actions/checkout-libkrucible
        with:
          ssh-key: ${{ secrets.LIBKRUCIBLE_SSH_KEY }}
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
          rustup component add rustfmt clippy
      - name: Check
        run: make check
      - name: Test and CLI contracts
        run: make test
      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Keep the runtime and CI Rust-only
        run: python3 scripts/check-rust-cutover.py
